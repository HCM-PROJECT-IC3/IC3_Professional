<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Prism Cascade — Mini Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/prism-cascade.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/accessibility.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="pc-body">
<style>
  /* Neumorphism + nút chuyển sáng/tối — gắn NHANH cho trang mini-game này
     (không sửa sâu CSS gốc của game để tránh vỡ layout đã tinh chỉnh kỹ).
     Dùng fallback trong var(...) nên KHÔNG cần trang này nạp css/theme.css
     riêng vẫn chạy được độc lập. */
  body { background: #e9ecf2 !important; transition: background .4s ease; }
  [data-theme="dark"] body { background: #20232b !important; }
  .theme-toggle-quick {
    position: fixed; top: 12px; right: 12px; z-index: 99999;
    width: 56px; height: 30px; border-radius: 999px; border: none;
    background: #e9ecf2; cursor: pointer;
    box-shadow: 6px 6px 14px rgba(163,177,198,.5), -6px -6px 14px rgba(255,255,255,.85);
    transition: box-shadow .3s ease, background .3s ease;
  }
  [data-theme="dark"] .theme-toggle-quick {
    background: #262b36;
    box-shadow: 6px 6px 14px rgba(0,0,0,.55), -6px -6px 14px rgba(255,255,255,.05);
  }
  .theme-toggle-quick::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background:
      radial-gradient(circle, #ffb938 0 36%, transparent 37%),
      radial-gradient(circle, #ffffff 0 60%, transparent 61%),
      repeating-conic-gradient(#ffb938 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(163,177,198,.7), -1px -1px 3px rgba(255,255,255,.8);
    transition: transform .55s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
  }
  [data-theme="dark"] .theme-toggle-quick::after {
    transform: translateX(26px) rotate(200deg);
    background:
      radial-gradient(.6px .6px at 30% 33%, rgba(255,255,255,.85) 99%, transparent 100%),
      radial-gradient(.5px .5px at 58% 28%, rgba(255,255,255,.7) 99%, transparent 100%),
      radial-gradient(.5px .5px at 44% 55%, rgba(255,255,255,.75) 99%, transparent 100%),
      radial-gradient(circle, #313650 0 36%, transparent 37%),
      radial-gradient(circle, #e7eaf2 0 60%, transparent 61%),
      repeating-conic-gradient(#aab0c4 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(0,0,0,.6), -1px -1px 3px rgba(255,255,255,.08);
  }
</style>
<button type="button" class="theme-toggle-quick" id="themeToggleQuick" title="Chuyển đổi sáng/tối"></button>
<script>
(function () {
  try {
    var saved = localStorage.getItem('ic3_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
  document.getElementById('themeToggleQuick').addEventListener('click', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ic3_theme', next); } catch (e) {}
  });
})();
</script>


  <!-- Trang này được nhúng qua modal (js/game-modal.js) giống
       kiểu "Kệ sách 3D" (js/game-modal.js) — chỉ chứa đúng 1 mini-game
       độc lập, không đụng vào quiz-engine.js / gamification.js.
       Phạm vi MVP: core loop match-3 (swap/match/cascade/chain combo),
       CHƯA có Special Piece / Obstacle / RPG-Companion / Meta Game
       (xem match3-game-design-document.md để mở rộng về sau). -->

  <div class="pc-wrap">
    <div class="pc-header">
      <div class="pc-title">✨ Prism Cascade</div>
      <div class="pc-subtitle">Khớp ≥3 Shard cùng loại để giải phóng năng lượng — giải trí giữa giờ ôn IC3</div>
    </div>

    <div class="pc-hud">
      <div class="pc-stat">
        <div class="pc-stat-label">Điểm</div>
        <div class="pc-stat-value" id="gameScore">0</div>
      </div>
      <div class="pc-stat">
        <div class="pc-stat-label">Lượt còn</div>
        <div class="pc-stat-value" id="gameMoves">20</div>
      </div>
      <div class="pc-stat">
        <div class="pc-stat-label">Mục tiêu</div>
        <div class="pc-stat-value" id="gameTarget">3.000</div>
      </div>
    </div>

    <div class="pc-progress-wrap">
      <div class="pc-progress-fill" id="gameProgressFill"></div>
    </div>

    <div class="pc-board-outer">
      <div class="pc-board" id="gameBoard"></div>
      <div class="combo-banner" id="comboBanner"></div>
      <div class="pc-toast" id="gameToast"></div>
    </div>

    <div class="pc-footer">
      <button type="button" class="pc-btn" id="gameRestartBtn">🔄 Chơi lại</button>
    </div>
  </div>

  <!-- Win / Lose overlay -->
  <div class="pc-overlay" id="gameOverlay">
    <div class="pc-overlay-card">
      <div class="pc-overlay-icon" id="gameOverlayIcon">🏆</div>
      <div class="pc-overlay-title" id="gameOverlayTitle">Hoàn thành mục tiêu!</div>
      <div class="pc-overlay-sub" id="gameOverlaySub"></div>
      <button type="button" class="pc-btn pc-btn-primary" id="gameOverlayRestartBtn">🔄 Chơi lại</button>
    </div>
  </div>

  <script src="js/prism-cascade.js"></script>
<script src="js/motion.js"></script>
</body>

</html>
