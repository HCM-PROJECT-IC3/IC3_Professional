<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="js/page-transition-guard.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f40b2">
<meta name="description" content="Sổ đầu bài điện tử: ghi tiết dạy, vắng, nhận xét; lớp và học sinh lấy từ dữ liệu có sẵn của trường.">
<title>Sổ đầu bài — EduQuiz</title>
<link rel="stylesheet" href="lib/fonts/fonts.css">
<link rel="stylesheet" href="css/so-dau-bai.css">
<script src="js/theme-inherit.js"></script>
</head>
<body>
<!-- Sổ đầu bài (js/so-dau-bai/): dữ liệu sổ ở localStorage sodaubai_v1 trên máy này, không lên Firebase/Apps Script.
     Lớp + học sinh lấy từ sổ lớp Điều phối đã đọc ở Điểm danh hoặc data/roster (sdb-sources.js). Chỉ giáo viên/admin. -->
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="var(--brand)"/><path d="M10 9.5h9.5a2.5 2.5 0 0 1 2.5 2.5v10.5H12.5A2.5 2.5 0 0 1 10 20z" fill="none" stroke="var(--brand-ink)" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 13.5h5M13.5 17h3.5" stroke="var(--brand-ink)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <div><div class="brand-name">Sổ đầu bài</div><div class="brand-sub" id="brandSub"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me" id="me"></div>
      <div class="row gap-s">
        <button class="btn ghost sm" id="themeBtn" type="button"></button>
        <button class="btn ghost sm" id="quickBackup" type="button"></button>
      </div>
      <div class="row gap-s">
        <a class="btn ghost sm" href="ic3-dashboard.html">← Trang quản lý</a>
        <button class="btn ghost sm" id="logoutBtn" type="button">Đăng xuất</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <span class="grow"></span>
      <button class="btn primary" id="newEntry" type="button"></button>
    </header>
    <main id="view"></main>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<dialog id="drawer" class="drawer"><form id="drawerForm" autocomplete="off"></form></dialog>
<dialog id="modal" class="modal"><form id="modalForm" autocomplete="off"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="filePick" hidden>

<script>window.EDU_ALLOWED_ROLES = ['admin', 'teacher'];</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/idle-logout.js"></script>
<!-- Đọc/xuất Excel; cùng bản với roster-manager/admin-users để dùng lại bộ nhớ đệm trình duyệt -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="js/so-lop/so-lop-core.js"></script>
<script src="js/name-picker/np-lessons.js"></script>
<script src="js/so-dau-bai/sdb-sources.js"></script>
<script src="js/so-dau-bai/ppct-ic3.js"></script>
<script src="js/so-dau-bai/sdb-app.js"></script>
</body>
</html>
