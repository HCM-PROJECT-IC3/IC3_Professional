<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thử thách cùng lớp | EduQuiz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!--
    "Thử thách cùng lớp" đã gộp vào Đấu trường (arena.html → Phòng cả lớp, js/arena/arena-room.js):
    chạy ngang hàng WebRTC, 0 lượt Firebase. Trang này chỉ còn để link cũ không chết:
      live-quiz.html?de=...   → arena.html?de=...#arRoomCard  (đề giáo viên soạn)
      live-quiz.html?room=... → arena.html#arRoomCard         (mã phòng Firebase cũ không còn dùng)
  -->
  <meta http-equiv="refresh" content="0; url=arena.html#arRoomCard">
  <script>
    (function () {
      var de = new URLSearchParams(location.search).get('de');
      location.replace('arena.html' + (de ? '?de=' + encodeURIComponent(de) : '') + '#arRoomCard');
    })();
  </script>
</head>
<body>
  <p>Thử thách cùng lớp đã chuyển vào <a href="arena.html#arRoomCard">Đấu trường → Phòng cả lớp</a>.</p>
</body>
</html>
