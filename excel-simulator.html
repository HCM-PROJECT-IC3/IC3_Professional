<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MOS Excel 2019 — Giả lập thao tác Ribbon</title>
<link rel="stylesheet" href="css/word-simulator.css" />
<link rel="stylesheet" href="css/excel-simulator.css" />
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="theme-excel">
<style>
  /* Neumorphism + nút chuyển sáng/tối — gắn NHANH cho trang mini-game này
     (không sửa sâu CSS gốc của game để tránh vỡ layout đã tinh chỉnh kỹ).
     Dùng fallback trong var(...) nên KHÔNG cần trang này nạp css/theme.css
     riêng vẫn chạy được độc lập. */
  body { background: #e9ecf2 !important; transition: background .4s ease; }
  [data-theme="dark"] body { background: #20232b !important; }
  .theme-toggle-quick {
    position: fixed; top: 12px; right: 12px; z-index: 99999;
    width: 56px; height: 30px; border-radius: 999px; border: none;
    background: #e9ecf2; cursor: pointer;
    box-shadow: 6px 6px 14px rgba(163,177,198,.5), -6px -6px 14px rgba(255,255,255,.85);
    transition: box-shadow .3s ease, background .3s ease;
  }
  [data-theme="dark"] .theme-toggle-quick {
    background: #262b36;
    box-shadow: 6px 6px 14px rgba(0,0,0,.55), -6px -6px 14px rgba(255,255,255,.05);
  }
  .theme-toggle-quick::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background:
      radial-gradient(circle, #ffb938 0 36%, transparent 37%),
      radial-gradient(circle, #ffffff 0 60%, transparent 61%),
      repeating-conic-gradient(#ffb938 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(163,177,198,.7), -1px -1px 3px rgba(255,255,255,.8);
    transition: transform .55s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
  }
  [data-theme="dark"] .theme-toggle-quick::after {
    transform: translateX(26px) rotate(200deg);
    background:
      radial-gradient(.6px .6px at 30% 33%, rgba(255,255,255,.85) 99%, transparent 100%),
      radial-gradient(.5px .5px at 58% 28%, rgba(255,255,255,.7) 99%, transparent 100%),
      radial-gradient(.5px .5px at 44% 55%, rgba(255,255,255,.75) 99%, transparent 100%),
      radial-gradient(circle, #313650 0 36%, transparent 37%),
      radial-gradient(circle, #e7eaf2 0 60%, transparent 61%),
      repeating-conic-gradient(#aab0c4 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(0,0,0,.6), -1px -1px 3px rgba(255,255,255,.08);
  }
</style>
<button type="button" class="theme-toggle-quick" id="themeToggleQuick" title="Chuyển đổi sáng/tối"></button>
<script>
(function () {
  try {
    var saved = localStorage.getItem('ic3_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
  document.getElementById('themeToggleQuick').addEventListener('click', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ic3_theme', next); } catch (e) {}
  });
})();
</script>


  <!-- ============ MÀN HÌNH 1: CHỌN TIẾT ============ -->
  <div class="ws-screen" id="wsLobbyScreen">
    <header class="ws-lobby-header">
      <div class="ws-lobby-title">
        <span class="ws-lobby-emoji">📊</span>
        <div>
          <h1>MOS Excel 2019 — Ôn luyện cuối khóa</h1>
          <p>Thực hành thao tác Ribbon, mô phỏng đúng quy trình GMetrix</p>
        </div>
      </div>
      <div class="ws-lobby-total" id="wsLobbyTotal">Đang tải…</div>
    </header>
    <div class="ws-lesson-grid" id="wsLessonGrid"></div>
  </div>

  <!-- ============ MÀN HÌNH 2: LÀM TIẾT ============ -->
  <div class="ws-screen ws-hidden" id="wsLessonScreen">
    <header class="ws-lesson-header">
      <button type="button" class="ws-back-btn" id="wsBackBtn">← Danh sách tiết</button>
      <div class="ws-lesson-header-title">
        <h2 id="wsLessonTitle">—</h2>
        <p id="wsLessonSubtitle"></p>
      </div>
      <div class="ws-lesson-progress" id="wsLessonProgress">0/0</div>
    </header>

    <div class="ws-lesson-body">
      <!-- Danh sách nhiệm vụ (sidebar) -->
      <aside class="ws-task-rail" id="wsTaskRail"></aside>

      <!-- Sân khấu chính -->
      <main class="ws-stage">
        <div class="ws-mission-card" id="wsMissionCard">
          <div class="ws-mission-file" id="wsMissionFile"></div>
          <div class="ws-mission-desc" id="wsMissionDesc"></div>
        </div>

        <div class="ws-instruction-bar" id="wsInstructionBar">
          <span class="ws-instruction-step" id="wsInstructionStepNum"></span>
          <span class="ws-instruction-text" id="wsInstructionText"></span>
        </div>

        <!-- Cửa sổ Excel giả lập -->
        <div class="ww-window">
          <div class="ww-titlebar">
            <span class="ww-titlebar-icon">X</span>
            <div class="ww-qat" aria-hidden="true">
              <span class="ww-qat-btn" title="AutoSave">⏺</span>
              <span class="ww-qat-btn" title="Save">💾</span>
              <span class="ww-qat-btn" title="Undo">↶</span>
              <span class="ww-qat-btn" title="Redo">↷</span>
            </div>
            <span class="ww-titlebar-text" id="wwDocName">Book1 - Excel</span>
            <div class="ww-winctrls" aria-hidden="true">
              <span class="ww-winctrl">🗕</span>
              <span class="ww-winctrl">🗗</span>
              <span class="ww-winctrl ww-winctrl-close">🗙</span>
            </div>
          </div>
          <div class="ww-ribbon">
            <div class="ww-tabs" id="wwTabs"></div>
            <div class="ww-groups" id="wwGroups"></div>
          </div>
          <div class="xw-formula-bar">
            <span class="xw-name-box" id="xwNameBox">A1</span>
            <span class="xw-fx">fx</span>
            <span class="xw-formula-input"></span>
          </div>
          <div class="ww-canvas xw-canvas">
            <div class="xw-grid" id="xwGrid"></div>
          </div>
          <div class="xw-sheet-tabs" id="xwSheetTabs"></div>
          <div class="ww-statusbar">
            <span>✔️ Ready</span>
            <span class="ww-statusbar-spacer"></span>
            <span class="ww-statusbar-views">🔲 📄 🔍</span>
            <span class="ww-statusbar-zoom">➖ ▬▬▬●▬▬▬ ➕ 100%</span>
          </div>
        </div>

        <div class="ws-mission-footer">
          <button type="button" class="ws-skip-btn" id="wsSkipBtn">Bỏ qua bước này →</button>
        </div>
      </main>
    </div>
  </div>

  <!-- ============ MODAL: hộp thoại giả lập ============ -->
  <div class="ww-dialog-overlay ws-hidden" id="wwDialogOverlay">
    <div class="ww-dialog" id="wwDialog">
      <div class="ww-dialog-title" id="wwDialogTitle">Hộp thoại</div>
      <div class="ww-dialog-body" id="wwDialogBody"></div>
      <div class="ww-dialog-footer" id="wwDialogFooter"></div>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div class="ws-toast ws-hidden" id="wsToast"></div>

  <script src="js/ribbon-sim-core.js"></script>
  <script src="js/excel-simulator.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
