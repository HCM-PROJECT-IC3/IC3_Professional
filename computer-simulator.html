<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="js/page-transition-guard.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Simulator — Mini Game</title>
<link rel="stylesheet" href="lib/fonts/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<script src="js/theme-inherit.js"></script>
<link rel="stylesheet" href="css/computer-simulator.css">
  <link rel="stylesheet" href="css/accessibility.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="lib/fontawesome/css/fa.min.css">
</head>
<body class="cs-body">
<link rel="stylesheet" href="css/theme-toggle-quick.css">
<button type="button" class="theme-toggle-quick" id="themeToggleQuick" title="Chuyển đổi sáng/tối"></button>
<script src="js/theme-toggle-quick.js"></script>

  <!-- Máy tính ảo: thao tác tệp/thư mục (tạo, đổi tên, di chuyển, sao chép, xoá, tìm) trên cây thư mục trong bộ nhớ, theo 5 nhiệm vụ. Nhúng qua js/game-modal.js. -->

  <div class="cs-wrap">

    <!-- ============ TOPBAR ============ -->
    <div class="cs-topbar">
      <div class="cs-header">
        <div class="cs-title"><i class="fa-solid fa-laptop" aria-hidden="true"></i> Computer Simulator</div>
        <div class="cs-subtitle" id="csMissionTitle">Đang tải nhiệm vụ…</div>
      </div>
      <button type="button" class="cs-restart-btn" id="csRestartBtn" title="Chọn nhiệm vụ khác"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Nhiệm vụ khác</button>
    </div>

    <!-- ============ MÔ TẢ NHIỆM VỤ ============ -->
    <div class="cs-mission-box" id="csMissionInstruction"></div>

    <!-- ============ FILE EXPLORER ============ -->
    <div class="cs-explorer">
      <div class="cs-toolbar">
        <button type="button" class="cs-tool-btn" id="csNewFolderBtn" title="Tạo thư mục mới"><i class="fa-solid fa-folder-plus" aria-hidden="true"></i> Thư mục mới</button>
        <button type="button" class="cs-tool-btn" id="csRenameBtn" disabled title="Đổi tên mục đang chọn"><i class="fa-solid fa-pen" aria-hidden="true"></i> Đổi tên</button>
        <button type="button" class="cs-tool-btn" id="csMoveBtn" disabled title="Di chuyển mục đang chọn"><i class="fa-solid fa-scissors" aria-hidden="true"></i> Di chuyển</button>
        <button type="button" class="cs-tool-btn" id="csCopyBtn" disabled title="Sao chép mục đang chọn"><i class="fa-solid fa-copy" aria-hidden="true"></i> Sao chép</button>
        <button type="button" class="cs-tool-btn cs-tool-btn-danger" id="csDeleteBtn" disabled title="Xoá mục đang chọn"><i class="fa-solid fa-trash-can" aria-hidden="true"></i> Xoá</button>
        <input type="text" class="cs-search-input" id="csSearchInput" placeholder="Tìm kiếm file/thư mục…">
      </div>

      <div class="cs-breadcrumb" id="csBreadcrumb"></div>

      <div class="cs-search-results" id="csSearchResults"></div>

      <div class="cs-content" id="csContent"></div>
    </div>

    <!-- ============ NỘP KẾT QUẢ ============ -->
    <div class="cs-submit-bar">
      <div class="cs-feedback" id="csFeedback"></div>
      <button type="button" class="cs-btn cs-btn-primary" id="csCheckBtn"><i class="fa-solid fa-check" aria-hidden="true"></i> Kiểm tra kết quả</button>
    </div>

    <!-- ============ MÀN CHỌN NHIỆM VỤ ============ -->
    <div class="cs-overlay" id="csMissionOverlay">
      <div class="cs-overlay-card">
        <div class="cs-overlay-icon"><i class="fa-solid fa-laptop" aria-hidden="true"></i></div>
        <div class="cs-overlay-title">Chọn 1 nhiệm vụ</div>
        <div class="cs-overlay-desc">Mỗi nhiệm vụ mô phỏng 1 thao tác quản lý tệp tin thật trên máy tính — làm càng ít lỗi thử-sai, điểm càng cao!</div>
        <div class="cs-mission-list" id="csMissionList"></div>
      </div>
    </div>

    <!-- ============ MÀN KẾT QUẢ ============ -->
    <div class="cs-overlay" id="csResultOverlay" hidden>
      <div class="cs-overlay-card">
        <div class="cs-overlay-icon" id="csResultIcon"><i class="fa-solid fa-trophy" aria-hidden="true"></i></div>
        <div class="cs-overlay-title" id="csResultTitle">Hoàn thành!</div>
        <div class="cs-overlay-desc" id="csResultDesc"></div>
        <div class="cs-overlay-actions">
          <button type="button" class="cs-btn cs-btn-primary" id="csNextMissionBtn"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Nhiệm vụ khác</button>
        </div>
      </div>
    </div>

    <!-- ============ OVERLAY CHỌN THƯ MỤC ĐÍCH (Di chuyển/Sao chép) ============ -->
    <div class="cs-overlay" id="csPickerOverlay" hidden>
      <div class="cs-overlay-card">
        <div class="cs-overlay-title" id="csPickerTitle">Chọn thư mục đích</div>
        <div class="cs-picker-tree" id="csPickerTree"></div>
        <div class="cs-overlay-actions cs-overlay-actions-row">
          <button type="button" class="cs-btn cs-btn-secondary" id="csPickerCancelBtn">Huỷ</button>
          <button type="button" class="cs-btn cs-btn-primary" id="csPickerConfirmBtn" disabled>Xác nhận</button>
        </div>
      </div>
    </div>

  </div>

  <!-- XP / nhiệm vụ ngày / huy hiệu tính hoàn toàn trên máy (js/gamification.js) —
       game KHÔNG nạp Firebase: không tốn lượt đọc/ghi, trang nhẹ hơn. -->
  <script src="js/gamification.js"></script>
  <script src="js/game-sfx.js"></script>
  <script src="js/game-fx.js"></script>

  <script src="js/minigame-arena-bridge.js"></script>
  <script src="js/computer-simulator.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
