# Đẩy ảnh máy chủ trường lên GitHub Container Registry để trường khác chỉ cần `docker compose pull`
# (không clone repo, không build). Dung lượng ảnh không tính vào dung lượng repo.
# Chạy khi: gắn tag server-v* (vd: git tag server-v2026.11.01 && git push origin server-v2026.11.01)
# hoặc bấm Run workflow ở tab Actions. Lần đầu: Packages → school-server → đặt Public.
name: Đẩy ảnh máy chủ trường

on:
  push:
    tags: ['server-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Đăng nhập ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + đẩy
        run: |
          IMG="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/school-server"
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "$IMG:latest" "$IMG:${GITHUB_REF_NAME#server-v}"
            docker push "$IMG:${GITHUB_REF_NAME#server-v}"
          fi
          echo "Đã đẩy $IMG"
