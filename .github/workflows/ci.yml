# Kiểm tra tự động mỗi lần đẩy code / mở Pull Request.
# Chỉ KIỂM TRA (không deploy, không đụng Firebase, không cần secret).
# Lỗi ở bước nào → dấu ✗ đỏ trên GitHub, xem log để biết file/câu nào hỏng.
name: Kiểm tra dự án

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ngân hàng câu hỏi data/ic3 hợp lệ
        run: node scripts/validate-data.js

      - name: Bộ "Theo chủ đề" khớp data/ic3/topic-reassign.json
        run: node scripts/apply-topic-reassign.js --check

      - name: Ngân hàng câu hỏi khớp đáp án All Key (data/ic3/allkey-sync.json)
        run: node scripts/apply-allkey-sync.js --check

      - name: Cú pháp mọi file JS
        run: node scripts/check-js.js

      - name: Trang HTML/CSS không trỏ tới file đã xoá/đổi tên
        run: node scripts/check-html.js

      - name: Kiến trúc sạch — Domain thuần, giao diện không thêm lượt gọi Firestore trực tiếp
        run: node scripts/check-architecture.js

      - name: Đường dẫn cũ giữ nguyên + bản build React (app/) đầy đủ
        run: node scripts/check-legacy-paths.js

      - name: Không lấy chữ thuần bằng innerHTML (chạy được onerror trong nội dung câu hỏi)
        run: node scripts/check-plain-text.js

      - name: Unit test (mô phỏng Word/Excel/PowerPoint, lưu bài nộp, gọi Apps Script)
        run: |
          for t in js/*/__tests__/*.test.js; do
            echo "▶ $t"
            node "$t"
          done

      - name: Apps Script — apps/Code.gs khớp apps/src/*.gs
        run: node scripts/build-apps-script.js --check

      - name: Apps Script — test với Google/Firebase/GitHub giả lập
        run: node apps/__tests__/code-gs.test.js

      - name: MOS — tiêu chí chấm không "đạt sẵn" trên tệp đề gốc
        run: node mos/tools/test-rubrics.js

      - name: Máy chủ trường (server/) — hàng đợi bài nộp + phát trang
        run: node server/__tests__/server.test.js

  # firestore.rules chạy THẬT trên Firestore emulator (project giả demo-ic3, không đụng Firebase thật):
  # cách ly giữa các trường, không tự nâng quyền, Quản trị trường, các collection đã đóng ghi.
  # Job riêng: cần Java + tải firebase-tools (~1 phút); job "check" ở trên không phải chờ.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cài firebase-tools + @firebase/rules-unit-testing
        working-directory: tests/firestore-rules
        run: npm install --no-audit --no-fund
      - name: Kiểm thử phân quyền trên emulator
        working-directory: tests/firestore-rules
        run: npm test

  # IC3 Professional 2.0 (React, web/): kiểu TypeScript + build thử vào thư mục tạm.
  # Bản phục vụ thật là app/ đã commit (GitHub Pages không có bước build) — job này
  # chỉ bắt lỗi mã nguồn; job "check" bắt app/ thiếu file.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cài thư viện
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Kiểm tra kiểu TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Build thử (không ghi đè app/)
        working-directory: web
        run: npx vite build --outDir "$RUNNER_TEMP/app-build" --emptyOutDir

  # Ảnh Docker của máy chủ trường: build + chạy thử (không đẩy đi đâu).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build ảnh
        run: docker build -t ic3-school-server .
      - name: Chạy thử container
        run: |
          docker run -d --name ic3 -p 8080:8080 -e GAS_FLUSH_SEC=3600 -e SITE_SYNC_MIN=0 ic3-school-server  # không gọi Google/GitHub
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -qi '<html'
          curl -fs http://127.0.0.1:8080/js/backend-config.js | grep -q "schoolServer"
          curl -fs http://127.0.0.1:8080/mos/api/info | grep -q '"mos"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/apps/Code.gs)" = 404
          curl -fs -X POST -H 'Content-Type: text/plain' http://127.0.0.1:8080/api/gas \
            -d '{"action":"submitExam","endpoint":"https://script.google.com/macros/s/TEST/exec","payload":{"submissionId":"ci000001","studentName":"CI"}}' | grep -q '"queued":true'
          docker exec ic3 test -s /data/outbox.jsonl
          curl -fs http://127.0.0.1:8080/api/status | grep -q '"siteSync"'
          curl -fs -H 'Accept-Encoding: gzip' -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/mos/ | grep -q 200
          echo "Kích thước ảnh: $(docker image inspect ic3-school-server --format '{{.Size}}' | numfmt --to=iec)"
      - name: Log container khi lỗi
        if: failure()
        run: docker logs ic3 || true
