<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 Sudoku Trí Tuệ — Mini Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/sudoku.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/accessibility.css">
</head>

<body class="sk-body">
<style>
  /* Neumorphism + nút chuyển sáng/tối — gắn NHANH cho trang mini-game này
     (không sửa sâu CSS gốc của game để tránh vỡ layout đã tinh chỉnh kỹ).
     Dùng fallback trong var(...) nên KHÔNG cần trang này nạp css/theme.css
     riêng vẫn chạy được độc lập. */
  body { background: #e9ecf2 !important; transition: background .4s ease; }
  [data-theme="dark"] body { background: #20232b !important; }
  .theme-toggle-quick {
    position: fixed; top: 12px; right: 12px; z-index: 99999;
    width: 56px; height: 30px; border-radius: 999px; border: none;
    background: #e9ecf2; cursor: pointer;
    box-shadow: 6px 6px 14px rgba(163,177,198,.5), -6px -6px 14px rgba(255,255,255,.85);
    transition: box-shadow .3s ease, background .3s ease;
  }
  [data-theme="dark"] .theme-toggle-quick {
    background: #262b36;
    box-shadow: 6px 6px 14px rgba(0,0,0,.55), -6px -6px 14px rgba(255,255,255,.05);
  }
  .theme-toggle-quick::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background:
      radial-gradient(circle, #ffb938 0 36%, transparent 37%),
      radial-gradient(circle, #ffffff 0 60%, transparent 61%),
      repeating-conic-gradient(#ffb938 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(163,177,198,.7), -1px -1px 3px rgba(255,255,255,.8);
    transition: transform .55s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
  }
  [data-theme="dark"] .theme-toggle-quick::after {
    transform: translateX(26px) rotate(200deg);
    background:
      radial-gradient(.6px .6px at 30% 33%, rgba(255,255,255,.85) 99%, transparent 100%),
      radial-gradient(.5px .5px at 58% 28%, rgba(255,255,255,.7) 99%, transparent 100%),
      radial-gradient(.5px .5px at 44% 55%, rgba(255,255,255,.75) 99%, transparent 100%),
      radial-gradient(circle, #313650 0 36%, transparent 37%),
      radial-gradient(circle, #e7eaf2 0 60%, transparent 61%),
      repeating-conic-gradient(#aab0c4 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(0,0,0,.6), -1px -1px 3px rgba(255,255,255,.08);
  }
</style>
<button type="button" class="theme-toggle-quick" id="themeToggleQuick" title="Chuyển đổi sáng/tối"></button>
<script>
(function () {
  try {
    var saved = localStorage.getItem('ic3_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
  document.getElementById('themeToggleQuick').addEventListener('click', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ic3_theme', next); } catch (e) {}
  });
})();
</script>


  <!-- Trang này được nhúng qua modal (js/game-modal.js), cùng pattern
       với game.html / memory-game.html — chỉ chứa đúng 1 mini-game
       độc lập, không đụng vào quiz-engine.js / gamification.js.
       Cơ chế: Sudoku 9x9 chuẩn, sinh đề ngẫu nhiên đảm bảo lời giải
       duy nhất (backtracking + kiểm tra số nghiệm), 3 mức độ khó.
       Toàn bộ logic khai báo trong js/sudoku.js. -->

  <div class="sk-wrap">
    <div class="sk-header">
      <div class="sk-title">🧩 Sudoku Trí Tuệ</div>
      <div class="sk-subtitle" id="skSubtitle">Chọn độ khó để bắt đầu rèn luyện tư duy logic</div>
    </div>

    <!-- Màn hình chọn độ khó -->
    <div class="sk-picker" id="skPicker"></div>

    <!-- Màn hình chơi -->
    <div class="sk-play" id="skPlay" style="display:none;">
      <div class="sk-hud">
        <div class="sk-stat">
          <div class="sk-stat-label">Thời gian</div>
          <div class="sk-stat-value" id="skTimer">00:00</div>
        </div>
        <div class="sk-stat">
          <div class="sk-stat-label">Lỗi</div>
          <div class="sk-stat-value" id="skMistakes">0 / 3</div>
        </div>
        <div class="sk-stat">
          <div class="sk-stat-label">Gợi ý</div>
          <div class="sk-stat-value" id="skHints">3</div>
        </div>
      </div>

      <div class="sk-board-outer">
        <div class="sk-board" id="skBoard"></div>
        <div class="sk-toast" id="skToast"></div>

        <!-- Win / Lose overlay -->
        <div class="sk-overlay" id="skOverlay">
          <div class="sk-overlay-card">
            <div class="sk-overlay-icon" id="skOverlayIcon">🏆</div>
            <div class="sk-overlay-title" id="skOverlayTitle">Hoàn thành!</div>
            <div class="sk-overlay-sub" id="skOverlaySub"></div>
            <div class="sk-overlay-stats" id="skOverlayStats"></div>
            <button type="button" class="sk-btn sk-btn-primary" id="skOverlayRestartBtn">🔄 Chơi lại</button>
            <button type="button" class="sk-btn" id="skOverlayPickerBtn">🔀 Đổi độ khó</button>
          </div>
        </div>
      </div>

      <div class="sk-numpad" id="skNumpad"></div>

      <div class="sk-tools">
        <button type="button" class="sk-tool-btn" id="skEraseBtn">
          <span class="sk-tool-icon">🧽</span><span>Xóa</span>
        </button>
        <button type="button" class="sk-tool-btn" id="skNotesBtn">
          <span class="sk-tool-icon">✏️</span><span>Ghi chú</span>
        </button>
        <button type="button" class="sk-tool-btn" id="skHintBtn">
          <span class="sk-tool-icon">💡</span><span>Gợi ý</span><span class="sk-tool-badge" id="skHintBadge"></span>
        </button>
      </div>

      <div class="sk-footer">
        <button type="button" class="sk-btn" id="skRestartBtn">🔄 Chơi lại</button>
        <button type="button" class="sk-btn" id="skPickerBtn">🔀 Đổi độ khó</button>
      </div>
    </div>
  </div>

  <script src="js/sudoku.js"></script>
</body>

</html>
