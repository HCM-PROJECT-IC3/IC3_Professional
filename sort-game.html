<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧲 Phân Loại Thần Tốc — Mini Game</title>
  <link rel="stylesheet" href="lib/fonts/fonts.css">
  <link rel="stylesheet" href="css/sort-game.css">
  <link rel="stylesheet" href="css/accessibility.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="lib/fontawesome/css/fa.min.css">
</head>

<body class="sg-body game-dark-bg" data-backdrop="party">
<link rel="stylesheet" href="css/theme-toggle-quick.css">
<link rel="stylesheet" href="css/game-backdrop.css">
<button type="button" class="theme-toggle-quick" id="themeToggleQuick" title="Chuyển đổi sáng/tối"></button>
<script src="js/theme-toggle-quick.js"></script>

  <!-- Trang này được nhúng qua modal (js/game-modal.js), cùng pattern với
       memory-game.html — chỉ chứa đúng 1 mini-game độc lập,
       không đụng vào quiz-engine.js / gamification.js.
       Cơ chế: từng vật phẩm (dùng lại đúng ảnh trong img/memory-game/)
       hiện lên, học sinh bấm đúng "thùng" chủ đề trước khi hết giờ riêng
       của vật phẩm đó — càng đúng liên tiếp (combo) càng nhân điểm cao.
       Hết giờ TOÀN VÁN (theo độ khó) thì kết thúc, chấm sao theo độ chính
       xác + lưu kỷ lục điểm cao nhất mỗi độ khó. Toàn bộ logic khai báo
       trong js/sort-game.js. -->

  <div class="sg-wrap">
    <div class="sg-header">
      <div class="sg-title">🧲 Phân Loại Thần Tốc</div>
      <div class="sg-subtitle" id="sgSubtitle">Chọn độ khó để bắt đầu</div>
    </div>

    <!-- Màn hình chọn độ khó -->
    <div class="sg-picker" id="sgPicker"></div>

    <!-- Màn hình chơi -->
    <div class="sg-play" id="sgPlay" style="display:none;">
      <div class="sg-hud">
        <div class="sg-stat">
          <div class="sg-stat-label">Điểm</div>
          <div class="sg-stat-value" id="sgScore">0</div>
        </div>
        <div class="sg-stat">
          <div class="sg-stat-label">Combo</div>
          <div class="sg-stat-value" id="sgCombo">0</div>
        </div>
        <div class="sg-stat">
          <div class="sg-stat-label">Thời gian</div>
          <div class="sg-stat-value" id="sgRoundTimer">60s</div>
        </div>
      </div>

      <div class="sg-item-card" id="sgItemCard">
        <div class="sg-item-timerbar"><div class="sg-item-timerbar-fill" id="sgItemTimerFill"></div></div>
        <img class="sg-item-img" id="sgItemImg" src="" alt="">
        <div class="sg-item-label" id="sgItemLabel">—</div>
      </div>

      <div class="sg-bins" id="sgBins"></div>

      <!-- Kết quả -->
      <div class="sg-overlay" id="sgOverlay">
        <div class="sg-overlay-card">
          <div class="sg-overlay-icon" id="sgOverlayIcon">🏆</div>
          <div class="sg-overlay-title" id="sgOverlayTitle">Hết giờ!</div>
          <div class="sg-overlay-sub" id="sgOverlaySub"></div>
          <div class="sg-overlay-stats" id="sgOverlayStats"></div>
          <button type="button" class="sg-btn sg-btn-primary" id="sgOverlayRestartBtn">🔄 Chơi lại</button>
          <button type="button" class="sg-btn" id="sgOverlayPickerBtn">🔀 Đổi độ khó</button>
        </div>
      </div>

      <div class="sg-footer">
        <button type="button" class="sg-btn" id="sgRestartBtn">🔄 Chơi lại</button>
        <button type="button" class="sg-btn" id="sgPickerBtn">🔀 Đổi độ khó</button>
      </div>
    </div>
  </div>

  <script src="js/gamification.js"></script>
  <script src="js/game-sfx.js"></script>
  <script src="js/game-fx.js"></script>
  <script src="js/sort-game.js"></script>
<script src="js/motion.js"></script>
<script src="js/name-picker/np-art.js"></script>
<script src="js/game-backdrop.js"></script>
</body>

</html>
