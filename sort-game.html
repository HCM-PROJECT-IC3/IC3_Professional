<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧲 Phân Loại Thần Tốc — Mini Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/sort-game.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/accessibility.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="sg-body">
<style>
  /* Neumorphism + nút chuyển sáng/tối — gắn NHANH cho trang mini-game này
     (không sửa sâu CSS gốc của game để tránh vỡ layout đã tinh chỉnh kỹ).
     Dùng fallback trong var(...) nên KHÔNG cần trang này nạp css/theme.css
     riêng vẫn chạy được độc lập. */
  body { background: #e9ecf2 !important; transition: background .4s ease; }
  [data-theme="dark"] body { background: #20232b !important; }
  .theme-toggle-quick {
    position: fixed; top: 12px; right: 12px; z-index: 99999;
    width: 56px; height: 30px; border-radius: 999px; border: none;
    background: #e9ecf2; cursor: pointer;
    box-shadow: 6px 6px 14px rgba(163,177,198,.5), -6px -6px 14px rgba(255,255,255,.85);
    transition: box-shadow .3s ease, background .3s ease;
  }
  [data-theme="dark"] .theme-toggle-quick {
    background: #262b36;
    box-shadow: 6px 6px 14px rgba(0,0,0,.55), -6px -6px 14px rgba(255,255,255,.05);
  }
  .theme-toggle-quick::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background:
      radial-gradient(circle, #ffb938 0 36%, transparent 37%),
      radial-gradient(circle, #ffffff 0 60%, transparent 61%),
      repeating-conic-gradient(#ffb938 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(163,177,198,.7), -1px -1px 3px rgba(255,255,255,.8);
    transition: transform .55s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
  }
  [data-theme="dark"] .theme-toggle-quick::after {
    transform: translateX(26px) rotate(200deg);
    background:
      radial-gradient(.6px .6px at 30% 33%, rgba(255,255,255,.85) 99%, transparent 100%),
      radial-gradient(.5px .5px at 58% 28%, rgba(255,255,255,.7) 99%, transparent 100%),
      radial-gradient(.5px .5px at 44% 55%, rgba(255,255,255,.75) 99%, transparent 100%),
      radial-gradient(circle, #313650 0 36%, transparent 37%),
      radial-gradient(circle, #e7eaf2 0 60%, transparent 61%),
      repeating-conic-gradient(#aab0c4 0deg 7deg, transparent 7deg 45deg);
    box-shadow: 2px 3px 6px rgba(0,0,0,.6), -1px -1px 3px rgba(255,255,255,.08);
  }
</style>
<button type="button" class="theme-toggle-quick" id="themeToggleQuick" title="Chuyển đổi sáng/tối"></button>
<script>
(function () {
  try {
    var saved = localStorage.getItem('ic3_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
  document.getElementById('themeToggleQuick').addEventListener('click', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ic3_theme', next); } catch (e) {}
  });
})();
</script>


  <!-- Trang này được nhúng qua modal (js/game-modal.js), cùng pattern với
       memory-game.html/sudoku.html — chỉ chứa đúng 1 mini-game độc lập,
       không đụng vào quiz-engine.js / gamification.js.
       Cơ chế: từng vật phẩm (dùng lại đúng ảnh trong img/memory-game/)
       hiện lên, học sinh bấm đúng "thùng" chủ đề trước khi hết giờ riêng
       của vật phẩm đó — càng đúng liên tiếp (combo) càng nhân điểm cao.
       Hết giờ TOÀN VÁN (theo độ khó) thì kết thúc, chấm sao theo độ chính
       xác + lưu kỷ lục điểm cao nhất mỗi độ khó. Toàn bộ logic khai báo
       trong js/sort-game.js. -->

  <div class="sg-wrap">
    <div class="sg-header">
      <div class="sg-title">🧲 Phân Loại Thần Tốc</div>
      <div class="sg-subtitle" id="sgSubtitle">Chọn độ khó để bắt đầu</div>
    </div>

    <!-- Màn hình chọn độ khó -->
    <div class="sg-picker" id="sgPicker"></div>

    <!-- Màn hình chơi -->
    <div class="sg-play" id="sgPlay" style="display:none;">
      <div class="sg-hud">
        <div class="sg-stat">
          <div class="sg-stat-label">Điểm</div>
          <div class="sg-stat-value" id="sgScore">0</div>
        </div>
        <div class="sg-stat">
          <div class="sg-stat-label">Combo</div>
          <div class="sg-stat-value" id="sgCombo">0</div>
        </div>
        <div class="sg-stat">
          <div class="sg-stat-label">Thời gian</div>
          <div class="sg-stat-value" id="sgRoundTimer">60s</div>
        </div>
      </div>

      <div class="sg-item-card" id="sgItemCard">
        <div class="sg-item-timerbar"><div class="sg-item-timerbar-fill" id="sgItemTimerFill"></div></div>
        <img class="sg-item-img" id="sgItemImg" src="" alt="">
        <div class="sg-item-label" id="sgItemLabel">—</div>
      </div>

      <div class="sg-bins" id="sgBins"></div>

      <!-- Kết quả -->
      <div class="sg-overlay" id="sgOverlay">
        <div class="sg-overlay-card">
          <div class="sg-overlay-icon" id="sgOverlayIcon">🏆</div>
          <div class="sg-overlay-title" id="sgOverlayTitle">Hết giờ!</div>
          <div class="sg-overlay-sub" id="sgOverlaySub"></div>
          <div class="sg-overlay-stats" id="sgOverlayStats"></div>
          <button type="button" class="sg-btn sg-btn-primary" id="sgOverlayRestartBtn">🔄 Chơi lại</button>
          <button type="button" class="sg-btn" id="sgOverlayPickerBtn">🔀 Đổi độ khó</button>
        </div>
      </div>

      <div class="sg-footer">
        <button type="button" class="sg-btn" id="sgRestartBtn">🔄 Chơi lại</button>
        <button type="button" class="sg-btn" id="sgPickerBtn">🔀 Đổi độ khó</button>
      </div>
    </div>
  </div>

  <script src="js/gamification.js"></script>
  <script src="js/game-sfx.js"></script>
  <script src="js/game-fx.js"></script>
  <script src="js/sort-game.js"></script>
<script src="js/motion.js"></script>
</body>

</html>
